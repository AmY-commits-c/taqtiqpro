(function (root) {
  'use strict';

  // ───────────────────────── core/constants ─────────────────────────
  const HAMZA = 'ء', ALEF_MADDA = 'آ', ALEF_HAMZA_ABOVE = 'أ', WAW_HAMZA = 'ؤ',
    ALEF_HAMZA_BELOW = 'إ', YEH_HAMZA = 'ئ', ALEF = 'ا', TEH_MARBUTA = 'ة',
    TATWEEL = 'ـ', HEH = 'ه', WAW = 'و', ALEF_MAKSURA = 'ى', YEH = 'ي',
    NOON = 'ن', WASLA = 'ٱ', DAGGER_ALEF = 'ٰ';
  const FATHATAN = 'ً', DAMMATAN = 'ٌ', KASRATAN = 'ٍ', FATHA = 'َ', DAMMA = 'ُ',
    KASRA = 'ِ', SHADDA = 'ّ', SUKUN = 'ْ', MADDA_ABOVE = 'ٓ', HAMZA_ABOVE = 'ٔ',
    HAMZA_BELOW = 'ٕ';
  const HARAKAT = [FATHA, DAMMA, KASRA];
  const TANWEEN = [FATHATAN, DAMMATAN, KASRATAN];
  const LONG_VOWELS = [ALEF, WAW, YEH, ALEF_MAKSURA, DAGGER_ALEF];
  const TASHKEEL = [FATHATAN, DAMMATAN, KASRATAN, FATHA, DAMMA, KASRA, SHADDA, SUKUN, MADDA_ABOVE, HAMZA_ABOVE, HAMZA_BELOW, DAGGER_ALEF];
  const ALPHABETIC = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
  const HAMZAT = [HAMZA, ALEF_MADDA, ALEF_HAMZA_ABOVE, ALEF_HAMZA_BELOW, WAW_HAMZA, YEH_HAMZA, WASLA];
  const LETTERS = ALPHABETIC.concat(HAMZAT, [ALEF_MAKSURA, TEH_MARBUTA]).join('');
  const SUN_LETTERS = 'تثدذرزسشصضطظلن';
  const ALL_PUNCTUATION = '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~،؛؟«»';
  const HARAKAT_SET = new Set(HARAKAT), TANWEEN_SET = new Set(TANWEEN), TASHKEEL_SET = new Set(TASHKEEL),
    LETTERS_SET = new Set(LETTERS.split('')), LONG_VOWELS_SET = new Set(LONG_VOWELS);

  const METER_PRIORITY = {
    taweel: 30, hazaj: 25, rajaz: 25, saree: 25, kamel: 20, baseet: 20, ramal: 20, khafeef: 20,
    mutakareb: 20, mutadarak: 20, wafer: 10, munsareh: 15, madeed: 15, mujtath: 10, mudhare: 10, muqtadheb: 10
  };
  const prio = k => METER_PRIORITY[k] || 0;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\\-]/g, '\\$&');
  const round3 = x => Math.round(x * 1000) / 1000;

  // ───────────────────────── core/arabic ─────────────────────────
  function stripChars(text, set) { let o = ''; for (const c of text) if (!set.has(c)) o += c; return o; }
  function stripTashkeel(text) { return text ? stripChars(text, TASHKEEL_SET) : ''; }
  function normalizeLigatures(text) {
    if (!text) return '';
    const lig = { 'ﻻ': 'ل' + ALEF, 'ﻼ': 'ل' + ALEF, 'ﻷ': 'ل' + ALEF_HAMZA_ABOVE, 'ﻸ': 'ل' + ALEF_HAMZA_ABOVE,
      'ﻹ': 'ل' + ALEF_HAMZA_BELOW, 'ﻺ': 'ل' + ALEF_HAMZA_BELOW, 'ﻵ': 'ل' + ALEF_MADDA, 'ﻶ': 'ل' + ALEF_MADDA };
    for (const k in lig) text = text.split(k).join(lig[k]);
    return text.normalize('NFC');
  }
  const RE_SHADDA_HARAKA_ORDER = new RegExp('([' + FATHA + DAMMA + KASRA + FATHATAN + '])([' + SHADDA + '])', 'g');
  const RE_ALEF_HARAKA = new RegExp(ALEF + '[' + FATHA + DAMMA + KASRA + ']', 'g');
  const RE_ALEF_FATHATAN = new RegExp(ALEF + FATHATAN, 'g');
  function normalizeOrthography(text) {
    if (!text) return '';
    text = text.split(WASLA).join(ALEF).split(DAGGER_ALEF).join(ALEF);
    text = text.replace(RE_SHADDA_HARAKA_ORDER, '$2$1');
    text = text.replace(RE_ALEF_HARAKA, ALEF);
    text = text.replace(RE_ALEF_FATHATAN, FATHATAN + ALEF);
    return text;
  }

  // ───────────────────────── core/phonetics ─────────────────────────
  const ARUDI_REPLACEMENTS = [["\u0647\u0630\u0627", "\u0647\u064e\u0627\u0630\u064e\u0627"], ["\u0647\u0630\u064a", "\u0647\u064e\u0627\u0630\u0650\u064a"], ["\u0647\u0630\u0647", "\u0647\u064e\u0627\u0630\u0650\u0647\u0650\u064a"], ["\u0647\u0630\u0627\u0646", "\u0647\u064e\u0627\u0630\u064e\u0627\u0646"], ["\u0647\u0630\u064a\u0646", "\u0647\u064e\u0627\u0630\u064e\u064a\u0652\u0646"], ["\u0647\u0624\u0644\u0627\u0621", "\u0647\u064e\u0627\u0624\u064f\u0644\u064e\u0627\u0621\u0650"], ["\u0630\u0644\u0643", "\u0630\u064e\u0627\u0644\u0650\u0643\u064e"], ["\u0630\u0644\u0643\u0645\u0627", "\u0630\u064e\u0627\u0644\u0650\u0643\u064f\u0645\u064e\u0627"], ["\u0630\u0644\u0643\u0645", "\u0630\u064e\u0627\u0644\u0650\u0643\u064f\u0645"], ["\u0630\u0644\u0643\u0646", "\u0630\u064e\u0627\u0644\u0650\u0643\u064f\u0646\u0651\u064e"], ["\u0623\u0648\u0644\u0626\u0643", "\u0623\u064f\u0644\u064e\u0627\u0626\u0650\u0643\u064e"], ["\u0623\u0648\u0644\u0626\u0643\u0645", "\u0623\u064f\u0644\u064e\u0627\u0626\u0650\u0643\u064f\u0645"], ["\u0623\u0648\u0644\u0648", "\u0623\u064f\u0644\u064f\u0648"], ["\u0623\u0648\u0644\u064a", "\u0623\u064f\u0644\u0650\u064a"], ["\u0623\u0648\u0644\u0627\u062a", "\u0623\u064f\u0644\u064e\u0627\u062a"], ["\u0627\u0644\u0644\u0647", "\u0627\u0644\u0644\u0651\u064e\u0627\u0647"], ["\u0627\u0644\u0644\u0647\u0645", "\u0627\u0644\u0644\u0651\u064e\u0627\u0647\u064f\u0645\u0651\u064e"], ["\u0625\u0644\u0647", "\u0625\u0650\u0644\u064e\u0627\u0647"], ["\u0627\u0644\u0625\u0644\u0647", "\u0627\u0644\u0625\u0650\u0644\u064e\u0627\u0647"], ["\u0625\u0644\u0647\u064a", "\u0625\u0650\u0644\u064e\u0627\u0647\u0650\u064a"], ["\u0625\u0644\u0647\u0646\u0627", "\u0625\u0650\u0644\u064e\u0627\u0647\u064f\u0646\u064e\u0627"], ["\u0625\u0644\u0647\u0643\u0645", "\u0625\u0650\u0644\u064e\u0627\u0647\u064f\u0643\u064f\u0645"], ["\u0625\u0644\u0647\u0647\u0645", "\u0625\u0650\u0644\u064e\u0627\u0647\u064f\u0647\u064f\u0645"], ["\u0625\u0644\u0647\u0647\u0646", "\u0625\u0650\u0644\u064e\u0627\u0647\u064f\u0647\u064f\u0646\u0651\u064e"], ["\u0631\u062d\u0645\u0646", "\u0631\u064e\u062d\u0652\u0645\u064e\u0627\u0646"], ["\u0627\u0644\u0631\u062d\u0645\u0646", "\u0627\u0644\u0631\u0651\u064e\u062d\u0652\u0645\u064e\u0627\u0646"], ["\u0637\u0627\u0648\u0633", "\u0637\u064e\u0627\u0648\u064f\u0648\u0633"], ["\u062f\u0627\u0648\u062f", "\u062f\u064e\u0627\u0648\u064f\u0648\u062f"], ["\u0646\u0627\u0648\u0633", "\u0646\u064e\u0627\u0648\u064f\u0648\u0633"], ["\u0647\u0627\u0631\u0648\u0646", "\u0647\u064e\u0627\u0631\u064f\u0648\u0646"], ["\u0644\u0643\u0646", "\u0644\u064e\u0627\u0643\u0650\u0646"], ["\u0644\u0643\u0646\u0651", "\u0644\u064e\u0627\u0643\u0650\u0646\u0651\u064e"], ["\u0644\u0643\u0646\u0647", "\u0644\u064e\u0627\u0643\u0650\u0646\u0651\u064e\u0647\u064f\u0648"], ["\u0644\u0643\u0646\u0647\u0627", "\u0644\u064e\u0627\u0643\u0650\u0646\u0651\u064e\u0647\u064e\u0627"], ["\u0637\u0647", "\u0637\u064e\u0627\u0647\u064e\u0627"], ["\u064a\u0633", "\u064a\u064e\u0627\u0633\u0650\u064a\u0646"], ["\u0644\u0644\u0647", "\u0644\u0650\u0644\u0651\u064e\u0627\u0647"], ["\u0628\u0627\u0644\u0644\u0647", "\u0628\u0650\u0627\u0644\u0644\u0651\u064e\u0627\u0647"], ["\u0648\u0627\u0644\u0644\u0647", "\u0648\u064e\u0627\u0644\u0644\u0651\u064e\u0627\u0647"], ["\u062a\u0627\u0644\u0644\u0647", "\u062a\u064e\u0627\u0644\u0644\u0651\u064e\u0627\u0647"], ["\u0622\u0647", "\u0623\u064e\u0627\u0647\u0650"], ["\u0639\u0645\u0631\u0648", "\u0639\u064e\u0645\u0652\u0631"], ["\u0645\u0627\u0626\u0629", "\u0645\u0650\u0626\u064e\u0629"], ["\u0645\u0627\u0626\u062a\u0627\u0646", "\u0645\u0650\u0626\u064e\u062a\u064e\u0627\u0646"], ["\u0645\u0627\u0626\u062a\u064a\u0646", "\u0645\u0650\u0626\u064e\u062a\u064e\u064a\u0652\u0646"]];
  const REPL_MAP = new Map(ARUDI_REPLACEMENTS);
  const SPECIAL_REPL = [["\u0627\u0644\u0644\u0647", "\u0627\u0644\u0644\u0627\u0647"], ["\u0627\u0644\u0644\u0651\u0647", "\u0627\u0644\u0644\u0627\u0647"], ["\u0625\u0644\u0651\u064e\u0627", "\u0625\u0650\u0644\u0651\u064e\u0627"], ["\u0646\u0652 \u0627\u0644", "\u0646\u064e \u0627\u0644"], ["\u0644\u0652 \u0627\u0644", "\u0644\u0650 \u0627\u0644"], ["\u0652 \u0627\u0644", "\u0650 \u0627\u0644"], ["\u0639\u064e\u0645\u0652\u0631\u064d\u0648", "\u0639\u064e\u0645\u0652\u0631\u064d"], ["\u0639\u064e\u0645\u0652\u0631\u064f\u0648", "\u0639\u064e\u0645\u0652\u0631\u064f"], ["\u0639\u064e\u0645\u0652\u0631\u064c\u0648", "\u0639\u064e\u0645\u0652\u0631\u064c"]];
  const VALID_PREFIXES = new Set(['و', 'ف', 'ك', 'ب', 'ل', 'وب', 'فك', 'ول', 'فل']);
  const PREFIX_HARAKAT = { 'و': 'وَ', 'ف': 'فَ', 'ك': 'كَ', 'ب': 'بِ', 'ل': 'لِ' };

  const RE_LONG_VOWEL_WASL = /([^\s]\S*)([اىيو])\s+ا/g;
  const RE_SPACE_WASL = /\s+ا/g;
  const RE_ALLAH_PREFIX = new RegExp('([فوبتك])([' + FATHA + DAMMA + KASRA + ']?)ا(لل)', 'g');
  const RE_DETACH_AL = /(^|\s)([فوبتك])([َُِ])?ال/g;
  const RE_SOLAR_LAM = new RegExp(' ال([' + SUN_LETTERS + '])', 'g');
  const RE_MULTI_SPACES = / +/g;
  const RE_DOUBLE_HARAKA = new RegExp('([' + FATHA + DAMMA + KASRA + '])([' + FATHA + DAMMA + KASRA + ']+)', 'g');
  const RE_NORM_SHADDA = new RegExp('([' + HARAKAT.concat(TANWEEN).join('') + '])([' + SHADDA + '])', 'g');
  const STRIP_HARAKAT_RE = new RegExp('[' + HARAKAT.concat(TANWEEN, [SUKUN]).join('') + ']', 'g');
  const PREM_CHARS = new Set(HARAKAT.concat([SUKUN], LONG_VOWELS, TANWEEN, [SHADDA], LETTERS.split(''), [' ']));

  function processSpecialsBefore(bait) {
    if (bait && bait[0] === ALEF) bait = ALEF_HAMZA_ABOVE + FATHA + bait.slice(1);
    bait = bait.replace(RE_DETACH_AL, (m, a, b, c) => a + b + (c || '') + ' ال');
    // Lam syamsiyyah: gugurkan lam & GANDAKAN huruf syamsi walaupun shaddah tidak ditulis (الرَعد → ارّعد)
    bait = bait.replace(RE_SOLAR_LAM, (m, L, off, str) => {
      const rest = str.slice(off + m.length);
      if (L === 'ل' && /^[\u064B-\u0652]*ه/.test(rest)) return m; // lafaz الله — biar jadual penggantian urus
      return ' ا' + L + (L === 'ل' || rest[0] === SHADDA ? '' : SHADDA);
    });
    bait = bait.split('وا ').join('و ');
    if (bait.endsWith('وا')) bait = bait.slice(0, -1);
    bait = bait.split('وْا').join('و');
    if (bait.endsWith('وْا')) bait = bait.slice(0, -2) + 'و';
    for (const [k, v] of SPECIAL_REPL) bait = bait.split(k).join(v);

    const out = [];
    for (const word of bait.split(' ')) {
      if (!word) continue;
      const cands = [word.replace(STRIP_HARAKAT_RE, ''), stripTashkeel(word)];
      let found = false;
      const endMark = (word.match(/[\u064B-\u0650]$/) || [''])[0]; // kekalkan baris akhir asal (cth. اللَّهُ)
      const keepEnd = r => (endMark && !/[\u064B-\u0652]$/.test(r)) ? r + endMark : r;
      for (const c of cands) if (REPL_MAP.has(c)) { out.push(keepEnd(REPL_MAP.get(c))); found = true; break; }
      if (found) continue;
      for (const c of cands) {
        if (found) break;
        for (const [key, rep] of ARUDI_REPLACEMENTS) {
          if (key.length < 3) continue; // يس/طه: elak ليس → ليٰسين
          if (c.endsWith(key) && c.length > key.length) {
            const prefix = c.slice(0, -key.length);
            if (VALID_PREFIXES.has(prefix)) {
              out.push(keepEnd(prefix.split('').map(p => PREFIX_HARAKAT[p] || p).join('') + rep));
              found = true; break;
            }
          }
        }
      }
      if (!found) out.push(word);
    }
    bait = out.join(' ');
    if (bait.length > 1 && LETTERS_SET.has(bait[0]) && LETTERS_SET.has(bait[1]) && bait[1] !== ' ' &&
      ![ALEF, WAW, YEH, ALEF_MAKSURA].includes(bait[1])) bait = bait[0] + FATHA + bait.slice(1);

    let fin = '', i = 0;
    while (i < bait.length) {
      if (bait[i] === ALEF && i > 0 && TANWEEN_SET.has(bait[i - 1])) {
        i++;
        while (i < bait.length && PREM_CHARS.has(bait[i]) && !LETTERS_SET.has(bait[i])) i++;
        continue;
      }
      fin += bait[i]; i++;
    }
    return fin;
  }

  function resolveWasl(text) {
    text = text.replace(RE_LONG_VOWEL_WASL, '$1');
    text = text.replace(RE_SPACE_WASL, '');
    text = text.replace(RE_ALLAH_PREFIX, '$1$2$3');
    return text;
  }

  function extractPattern(text, saturate, muqayyad) {
    text = text.replace(RE_DOUBLE_HARAKA, '$1');
    text = text.split(ALEF_MADDA).join('ءَ' + ALEF);
    let tmp = ''; for (const c of text) if (PREM_CHARS.has(c)) tmp += c;
    const chars = Array.from(tmp.replace(RE_MULTI_SPACES, ' ').trim());
    const out = [], plain = [];
    let i = 0; const n = chars.length;
    while (i < n) {
      const ch = chars[i];
      let next = i + 1 < n ? chars[i + 1] : '';
      const nextNext = i + 2 < n ? chars[i + 2] : '';
      const prev = out.length ? out[out.length - 1] : '';
      if (ch === ' ') { plain.push(' '); i++; continue; }
      if (ch === ALEF || ch === ALEF_MAKSURA) { if (prev !== '0') out.push('0'); plain.push(ch); i++; continue; }
      if (LETTERS_SET.has(ch)) {
        if (next === ' ' && nextNext) next = nextNext;
        if (HARAKAT_SET.has(next)) {
          const isLast = i + 2 >= n;
          out.push(muqayyad && isLast ? '0' : '1'); plain.push(ch);
        } else if (next === SUKUN) {
          if (prev !== '0' || (i + 1) === n - 1) { out.push('0'); plain.push(ch); }
          else { if (plain.length && plain[plain.length - 1] === ' ') plain.pop(); plain.push(ch); }
        } else if (TANWEEN_SET.has(next)) {
          if (ch !== ALEF) plain.push(ch);
          plain.push(NOON); out.push('1', '0');
          if (i + 2 < n && chars[i + 2] === ALEF) i += 1;
        } else if (next === SHADDA) {
          if (prev !== '0') { plain.push(ch, ch); out.push('0', '1'); }
          else { if (plain.length && plain[plain.length - 1] === ' ') plain.pop(); plain.push(ch, ch); out.push('1'); }
          if (i + 2 < n) {
            if (HARAKAT_SET.has(chars[i + 2])) {
              const isLastSh = i + 3 >= n;
              if (muqayyad && isLastSh) out[out.length - 1] = '0';
              i += 1;
            } else if (TANWEEN_SET.has(chars[i + 2])) {
              i += 1; plain.push(NOON); out.push('0');
              if (i + 2 < n && chars[i + 2] === ALEF) i += 1;
            }
          }
        } else if (next === ALEF || next === ALEF_MAKSURA) {
          out.push('1', '0'); plain.push(ch, next);
        } else if (LETTERS_SET.has(next)) {
          if (prev !== '0') { out.push('0'); plain.push(ch); }
          else if (prev === '0' && i + 1 < n && chars[i + 1] === ' ') { out.push('1'); plain.push(ch); }
          else { if (plain.length && plain[plain.length - 1] === ' ') plain.pop(); plain.push(ch); out.push('0'); }
          i -= 1;
        } else {
          out.push(prev !== '0' ? '0' : '1'); plain.push(ch); i += 1; continue;
        }
        if (!muqayyad && nextNext === ' ' && out.length >= 2 && out[out.length - 2] === '1') {
          const isAllah = plain.length >= 3 && plain.slice(-4, -1).join('') === 'للا';
          if (ch === 'ه' && !isAllah) {
            if (next === KASRA) { plain.push(YEH); out.push('0'); }
            else if (next === DAMMA) { plain.push(WAW); out.push('0'); }
          }
        }
        i += 2;
      } else i += 1;
    }
    let pat = out.join(''), arudi = plain.join('');
    if (!muqayyad && saturate && pat && pat[pat.length - 1] !== '0') pat += '0';
    if (!muqayyad && saturate && n) {
      const last = chars[n - 1];
      if (last === KASRA) arudi += YEH;
      else if (last === KASRATAN) arudi = arudi.endsWith(NOON) ? arudi.slice(0, -1) + YEH : arudi + YEH;
      else if (last === FATHA) arudi += ALEF;
      else if (last === DAMMA) arudi += WAW;
      else if (last === DAMMATAN) arudi = arudi.endsWith(NOON) ? arudi.slice(0, -1) + WAW : arudi + WAW;
      else if (LONG_VOWELS_SET.has(last) && n > 1 && !TANWEEN_SET.has(chars[n - 2])) arudi += last;
    }
    return [arudi, pat];
  }


  // Pelengkap baris konservatif (gaya dīwān): huruf tanpa baris sebelum mad di hujung kata / sebelum alif.
  const MARKS = new Set([FATHA, DAMMA, KASRA, SUKUN, SHADDA, FATHATAN, DAMMATAN, KASRATAN]);
  function completeMadd(text) {
    return text.split(/(\s+)/).map(w => {
      if (/^\s+$/.test(w) || !w) return w;
      const ch = Array.from(w), n = ch.length;
      const letters = ch.filter(c => LETTERS_SET.has(c)).length;
      const out = [];
      for (let i = 0; i < n; i++) {
        const c = ch[i]; out.push(c);
        if (!LETTERS_SET.has(c) || c === ALEF || c === ALEF_MAKSURA) continue;
        if (i + 1 < n && MARKS.has(ch[i + 1])) continue;          // sudah berbaris
        const nx = ch[i + 1], after = ch[i + 2];
        const nxFinal = i + 2 >= n;
        if (nx === ALEF && !(after && MARKS.has(after))) {
          if (nxFinal && c === WAW) continue;                      // واو الجماعة: قالوا
          if (i === 0 && 'وفبكل'.includes(c) && after === 'ل') continue; // بال/وال/فال
          if (after === FATHATAN) continue;
          out.push(FATHA); continue;
        }
        if (nxFinal && nx === ALEF_MAKSURA && i > 0) { out.push(FATHA); continue; }
        if (letters >= 3 && nxFinal && nx === YEH && i > 0) { out.push(KASRA); continue; }
        if (letters >= 3 && nxFinal && nx === WAW && i > 0) { out.push(DAMMA); continue; }
      }
      return out.join('');
    }).join('');
  }

  function prepareText(text, saturate, muqayyad) {
    text = (text || '').trim();
    if (!text) return ['', ''];
    text = text.split(ALEF_MADDA).join('ءَ' + ALEF);
    text = completeMadd(text);

  function findBestMeter(sadrC, ajuzC, target) {
    let keys = Object.keys(PRE);
    if (target) { if (!PRE[target]) return []; keys = [target]; }
    const hasAjuz = ajuzC.some(c => c[1]);
    const cands = [];
    for (const name of keys) {
      const { d, sMap, aMap } = PRE[name];
      let bS = null, bSs = -1, bSi = '';
      for (const [, cp] of sadrC) {
        const m = sMap.has(cp) ? { score: 1, ref: sMap.get(cp) } : bestComponent(cp, d.sadr);
        if (m.score > bSs) { bSs = m.score; bS = m; bSi = cp; if (bSs === 1) break; }
      }
      let bA = null, bAs = -1, bAi = '';
      if (hasAjuz) for (const [, cp] of ajuzC) {
        if (!cp) continue;
        const m = aMap.has(cp) ? { score: 1, ref: aMap.get(cp) } : bestComponent(cp, d.ajuz);
        if (m.score > bAs) { bAs = m.score; bA = m; bAi = cp; if (bAs === 1) break; }
      }
      const aS = bA ? bAs : 0;
      let vp = false;
      if (bS && bS.ref && (!hasAjuz || (bA && bA.ref))) vp = d.pairs.has(bS.ref.pattern + '|' + (bA ? bA.ref.pattern : ''));
      const B0 = B[ALL_METERS[name]];
      cands.push({ meter_key: name, name_ar: B0.ar, name_en: B0.en, bahr_type: B0.bahr_type, score: hasAjuz ? (bSs + aS) / 2 : bSs, valid_pair: vp, sadr_in: bSi, ajuz_in: bAi });
    }
    cands.sort((a, b) => cmpKey([round3(b.score), b.valid_pair, prio(b.meter_key)], [round3(a.score), a.valid_pair, prio(a.meter_key)]));
    return cands;
  }

  function analyzeVerse(sadrText, ajuzText, forced, idx) {
    init();
    ajuzText = ajuzText || '';
    const sSat = prepareText(sadrText, true), sUns = prepareText(sadrText, false);
    const aSat = ajuzText ? prepareText(ajuzText, true) : ['', ''];
    const aUns = ajuzText ? prepareText(ajuzText, false, true) : ['', ''];
    const sadrC = [sSat]; if (sUns[1] !== sSat[1]) sadrC.push(sUns);
    const ajuzC = [aSat]; if (ajuzText && aUns[1] !== aSat[1]) ajuzC.push(aUns);

    const det = disambiguate(matchVerse(sadrC, ajuzC, forced), sadrC[0][1], ajuzC.length ? ajuzC[0][1] : '');
    if (det) {
      const [g, sd, ad, sc] = det;
      let cs = sadrC[0]; if (sd) for (const c of sadrC) if (c[1] === sd.pattern) { cs = c; break; }
      let ca = ajuzC.length ? ajuzC[0] : ['', '']; if (ad && ajuzText) for (const c of ajuzC) if (c[1] === ad.pattern) { ca = c; break; }
      const mk = fv => fv.map((f, i) => ({ foot_index: i, expected_pattern: f.pattern, actual_segment: f.pattern, base_tafeela: f.base_tafeela, actual_tafeela: f.actual_tafeela, actual_name: actualName(f.base_tafeela, f.pattern), zihaf_name_ar: f.zihaf_name_ar, zihaf_name_en: f.zihaf_name_en, zihaf_key: f.zihaf, cost: f.cost, score: 1, status: 'ok' }));
      return {
        verse_index: idx || 0, sadr_text: sadrText, ajuz_text: ajuzText, meter_key: g.meter_key, meter_name_ar: g.name_ar,
        meter_name_en: g.name_en, bahr_type: g.bahr_type, exact: true,
        standard_pattern: ((sd ? sd.feet.map(f => f.pattern).join(' ') : '') + (ad ? ' ' + ad.feet.map(f => f.pattern).join(' ') : '')).trim(),
        score: round3(sc), is_valid: true, errors: [],
        sadr: { text: sadrText, arudi_text: cs[0], pattern: cs[1], feet: sd ? mk(sd.feet) : [], score: 1, is_valid: true },
        ajuz: ajuzText ? { text: ajuzText, arudi_text: ca[0], pattern: ca[1], feet: (ad && ajuzText) ? mk(ad.feet) : [], score: 1, is_valid: true } : null
      };
    }
    const cands = findBestMeter(sadrC, ajuzC, forced);
    if (!cands.length) {
      return { verse_index: idx || 0, sadr_text: sadrText, ajuz_text: ajuzText, meter_key: 'unknown', meter_name_ar: 'بحر غير محدد',
        meter_name_en: 'Unknown Meter', bahr_type: 'unknown', exact: false, standard_pattern: '', score: 0, is_valid: false,
        errors: ['Could not determine poetic meter.'],
        sadr: { text: sadrText, arudi_text: sSat[0], pattern: sSat[1], feet: [], score: 0, is_valid: false },
        ajuz: ajuzText ? { text: ajuzText, arudi_text: aSat[0], pattern: aSat[1], feet: [], score: 0, is_valid: false } : null };
    }
    const best = cands[0], B0 = B[ALL_METERS[best.meter_key]];
    let cs = sadrC[0]; for (const c of sadrC) if (c[1] === best.sadr_in) { cs = c; break; }
    let ca = ajuzC[0]; if (ajuzText) for (const c of ajuzC) if (c[1] === best.ajuz_in) { ca = c; break; }
    const pats = PRE[best.meter_key].d;
    let sComp = bestComponent(cs[1], pats.sadr);
    const aComp = ajuzText ? bestComponent(ca[1], pats.ajuz) : null;
    // Tasri': 'arudh mengikut bentuk dharb (biasanya bait pertama yang musarra')
    let tasri = false;
    if (ajuzText && aComp && aComp.score === 1 && aComp.ref && aComp.ref.forms && sComp.score < 1) {
      const dForm = aComp.ref.forms[aComp.ref.forms.length - 1];
      outer: for (const c of sadrC) for (const S of pats.sadr) {
        if (!S.forms || S.bahr_type !== aComp.ref.bahr_type || S.forms.length !== aComp.ref.forms.length) continue;
        const forms = S.forms.slice(0, -1).concat([dForm]);
        const full = forms.map(f => f.pattern).join('');
        if (full === c[1]) { cs = c; sComp = { score: 1, ref: { pattern: full, feet: forms.map(f => f.pattern), forms, fb: S.fb, bahr_type: S.bahr_type } }; tasri = true; break outer; }
      }
    }
    const sFeet = analyzeFeet(cs[1], sComp.ref ? sComp.ref.feet : [], sComp.ref);
    if (tasri && sFeet.length) sFeet[sFeet.length - 1].tasri = true;
    const aFeet = ajuzText ? analyzeFeet(ca[1], aComp && aComp.ref ? aComp.ref.feet : [], aComp && aComp.ref) : null;
    const sS = sComp.score, aS = aComp ? aComp.score : 1;
    const comb = (sS + aS) / (ajuzText ? 2 : 1);
    const sOk = sFeet.every(f => f.status === 'ok'), aOk = aFeet ? aFeet.every(f => f.status === 'ok') : true;
    const errors = [];
    if (comb < 0.85) errors.push('Low metric similarity score: ' + comb.toFixed(2));
    sFeet.forEach(f => { if (f.status !== 'ok') errors.push('Sadr Foot ' + (f.foot_index + 1) + ' is ' + f.status + ': expected ' + f.expected_pattern + ', got ' + f.actual_segment); });
    (aFeet || []).forEach(f => { if (f.status !== 'ok') errors.push('Ajuz Foot ' + (f.foot_index + 1) + ' is ' + f.status + ': expected ' + f.expected_pattern + ', got ' + f.actual_segment); });
    return {
      verse_index: idx || 0, sadr_text: sadrText, ajuz_text: ajuzText, meter_key: best.meter_key, meter_name_ar: B0.ar, meter_name_en: B0.en,
      bahr_type: (sComp.ref && sComp.ref.bahr_type) || B0.bahr_type, exact: false, tasri,
      standard_pattern: (sComp.ref ? sComp.ref.pattern : '') + (aComp && aComp.ref ? ' ' + aComp.ref.pattern : ''),
      score: comb, is_valid: comb >= 0.85 && sOk && aOk, errors,
      ref_sadr: sComp.ref, ref_ajuz: aComp ? aComp.ref : null,
      sadr: { text: sadrText, arudi_text: cs[0], pattern: cs[1], feet: sFeet, score: sS, is_valid: sOk },
      ajuz: ajuzText ? { text: ajuzText, arudi_text: ca[0], pattern: ca[1], feet: aFeet || [], score: aS, is_valid: aOk } : null
    };
  }

  function processPoem(verses, meterName) {
    init();
    const first = [], counts = new Map();
    verses.forEach(([s, a], i) => {
      const v = analyzeVerse(s, a, meterName, i); first.push(v);
      if (v.meter_key !== 'unknown') counts.set(v.meter_key, (counts.get(v.meter_key) || 0) + 1);
    });
    let globalM = 'unknown';
    if (meterName) globalM = meterName;
    else if (counts.size) { let bc = -1; for (const [k, c] of counts) if (c > bc) { bc = c; globalM = k; } }
    const fin = verses.map(([s, a], i) => (meterName || globalM === 'unknown' || first[i].meter_key === globalM) ? first[i] : analyzeVerse(s, a, globalM, i));
    if (globalM === 'unknown') return { error: 'Could not detect any valid meter.', verses: fin };
    const B0 = B[ALL_METERS[globalM]];
    return { meter: globalM, meter_name_ar: B0.ar, meter_name_en: B0.en, verses: fin };
  }

  const API = { prepareText, analyzeVerse, processPoem, METER_KEYS: Object.keys(ALL_METERS), meterInfo: k => B[ALL_METERS[k]], similarity, _seqRatio: seqRatio };
  if (typeof module !== 'undefined' && module.exports) module.exports = API; else root.ArudJS = API;
})(typeof window !== 'undefined' ? window : this);

</script>
